workflows:
  ios-workflow:
    name: iOS Build and TestFlight (Fixed TFLite)
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Pre-build checks
        script: |
          echo "🔍 Checking Flutter version..."
          flutter --version
          
          echo "🔍 Checking CocoaPods version..."
          pod --version
          
          echo "🔍 Verifying TFLite model files..."
          ls -la assets/model/
          
          echo "🔍 Checking Podfile configuration..."
          cat ios/Podfile | grep -A 2 "TensorFlowLiteC" || echo "⚠️ TensorFlowLiteC not found in Podfile"
      
      - name: Get Flutter dependencies
        script: |
          echo "📦 Getting Flutter dependencies..."
          flutter pub get
          
      - name: Install CocoaPods dependencies
        script: |
          echo "📦 Installing iOS dependencies with CocoaPods..."
          cd ios
          pod repo update
          pod install
          echo "✅ Pod install completed"
          
          echo "🔍 Verifying TensorFlowLiteC installation..."
          if [ -d "Pods/TensorFlowLiteC" ]; then
            echo "✅ TensorFlowLiteC pod installed successfully"
            ls -la Pods/TensorFlowLiteC/
          else
            echo "❌ TensorFlowLiteC pod NOT found - AI model will fail!"
            exit 1
          fi
          cd ..
      
      - name: Flutter analyze
        script: |
          echo "🔍 Running Flutter analyze..."
          flutter analyze || echo "⚠️ Analysis warnings found"
      
      - name: Build iOS app
        script: |
          echo "🏗️ Building iOS IPA for TestFlight..."
          flutter build ipa \
            --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --verbose
          
          echo "✅ Build completed successfully!"
          ls -la build/ios/ipa/
    
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/Pods/Manifest.lock
      - flutter_analyze.log
    
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        submit_to_testflight: true
        # Add export compliance information
        export_compliance:
          uses_encryption: false # Set to true if your app uses encryption
          encryption_updated: false # Set to true if encryption has been updated